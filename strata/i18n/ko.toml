# strata 사용자 메시지 — 한국어 (en.toml 의 번역).
# {중괄호} 자리표시자는 호출하는 쪽이 채운다. 키는 en.toml 과 같게 유지한다.

[guard]
prefix = "strata 가 이 쓰기를 막았습니다"
immutable = "'{path}' 는 '{layer}' 층(불변)에 있습니다. 그 아래에는 만들거나 고치거나 지울 수 없습니다."
frozen = "'{path}' 는 '{layer}' 층(시점 고정)에 있습니다. 이미 있는 파일은 고치거나 지울 수 없습니다. 새 파일로 추가하십시오."
append_only_overwrite = "'{path}' 는 '{layer}' 층(추가 전용)에 있습니다. 파일을 통째로 바꾸지 말고, 그 자리에서 고치거나 새 기록을 더하십시오."
append_only_delete = "'{path}' 는 '{layer}' 층(추가 전용)에 있습니다. 기록은 지우지 않습니다. 대신 superseded 로 표시하십시오."
living_frozen_status = "'{path}' 의 상태가 '{status}' 로 고정돼 있습니다. 부분 수정은 되지만 통째 덮어쓰기와 삭제는 안 됩니다."
tree_holds_protected = "'{path}' 안에 보호된 파일이 있습니다(예: '{example}'). 통째 삭제나 이동을 막았습니다."
tree_too_large = "'{path}' 는 너무 커서 살펴볼 수 없고 보호된 층과 겹칩니다. 통째 삭제나 이동을 막았습니다."
closed_track = "'{path}' 는 열리지 않은 트랙 '{track}' 에 있습니다. 여는 결정이 나면 .strata/strata.toml 에서 open = true 로 바꾸십시오."
manifest_invalid = "프로젝트 매니페스트 .strata/strata.toml 이 올바르지 않아, 고칠 때까지 쓰기를 막습니다. .strata/ 폴더는 계속 쓸 수 있습니다."
manifest_problems = "문제: {problems}"
unparsable = "이 명령은 안전하게 해석할 수 없고, 보호된 경로를 담고 있습니다."
no_python = "이 프로젝트에서 쓰기를 확인하려면 Python 3.11 이상이 필요한데 찾지 못했습니다."
bypass = "의도했고 승인된 일이면, {env}=1 을 환경에 넣고 Claude Code 를 다시 띄우십시오. 명령 안에서 설정하면 효과가 없습니다."

[cli]
no_manifest = "{path} 와 그 위에서 strata 프로젝트를 찾지 못했습니다. `strata init` 으로 만드십시오."
manifest_invalid = "매니페스트 .strata/strata.toml 이 올바르지 않습니다:\n  {problems}"

[init]
unknown_language = "템플릿 언어 '{language}' 를 모릅니다. 쓸 수 있는 것: {known}."
bad_name = "'{name}' 는 프로젝트 ID 로 쓸 수 없습니다. 영문 소문자로 시작하고, 소문자 · 숫자 · '-' 만 쓰십시오."
exists = "아무것도 쓰지 않았습니다: '{path}' 가 이미 있습니다. strata init 은 덮어쓰지 않습니다."
created = "프로젝트 '{name}'({language})의 파일과 폴더 {count}개를 {root} 에 만들었습니다:"
next = "다음: .strata/strata.toml 을 읽고 트랙과 층을 맞춘 뒤 `strata validate` 를 돌리십시오."

[validate]
frontmatter_unterminated = "프런트매터가 '---' 로 시작했지만 끝나지 않습니다"
unknown_type = "문서 타입 '{type}' 가 매니페스트에 선언돼 있지 않습니다"
missing_key = "타입 '{type}' 에는 프런트매터 키 '{key}' 가 필요합니다"
missing_section = "타입 '{type}' 에는 절 '{section}' 이 필요합니다"
tag_without_reference = "증거 태그 {label} 는 같은 줄에 {pattern} 에 맞는 참조가 있어야 합니다"
not_utf8 = "UTF-8 텍스트 파일이 아닙니다"
unreadable = "파일을 읽을 수 없습니다: {error}"
summary = "파일 {files}개 검사: 오류 {errors}건, 경고 {warnings}건."
clean = "파일 {files}개 검사: 문제 없음."

[validate.severity]
error = "오류"
warning = "경고"

[status]
header = "strata · {project} ({language})"
tracks = "트랙: {tracks}"
track_open = "{id} 열림"
track_closed = "{id} 닫힘"
layers = "층:"
layer_line = "{id} · {mode} · 파일 {files}개"
documents = "문서: {documents} · 타입 없음: {untyped}"
undeclared_type = "타입 '{type}' 를 쓰고 있지만 선언하지 않았습니다"
registers = "등록부:"
register_line = "{id} · 열림 {open} / 전체 {total} · {path}"
register_missing = "{id} · 파일 없음: {path}"
records = "최근 기록:"
record_line = "{time} · {kind} · {target} · {actor} · {result}"
no_records = "아직 기록이 없습니다."

[record]
title = "기록 {month}"
empty = "'{field}' 는 비워 둘 수 없습니다."
too_long = "'{field}' 가 {limit}자를 넘습니다. 자세한 내용은 파일에 두고 --evidence 로 가리키십시오."
added = "{path} 에 기록했습니다({time})."
none = "아직 기록이 없습니다."

[record.column]
time = "시각"
kind = "종류"
target = "대상"
actor = "주체"
result = "결과"
evidence = "근거"
note = "메모"

[register]
title = "등록부: {register}"
unknown = "등록부 '{register}' 를 모릅니다. 선언된 것: {known}."
missing_file = "등록부 '{register}' 의 파일이 {path} 에 없습니다. `strata init` 으로 만들거나 되살리십시오. strata 는 번호를 1부터 다시 매기지 않습니다."
empty_title = "제목은 비워 둘 수 없습니다."
empty_resolution = "처리 내용은 비워 둘 수 없습니다."
unknown_id = "'{id}' 는 선언된 어느 등록부에도 속하지 않습니다."
no_such_id = "등록부 '{register}' 에 {id} 항목이 없습니다."
not_open = "{id} 는 열린 항목이 아닙니다(상태: {status})."
added = "등록부 '{register}' 에 {id} 를 더했습니다."
closed = "{id} 를 닫았습니다."
none = "항목이 없습니다."
line = "{register} · {id} · {status} · {date} · {title}"

[register.column]
id = "ID"
date = "날짜"
status = "상태"
title = "제목"
source = "출처"
resolution = "처리"
